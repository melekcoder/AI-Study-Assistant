<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notu Düzenle - AI Study Assistant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0d0b18; color: #e2e1e9; margin: 0; padding: 0; }
        .TumEkran { display: flex; height: 100vh; }
        .SolMenu { width: 250px; background-color: #110e25; padding: 20px; border-right: 2px solid #a40ae0; }
        .MenuBaslik { font-size: 20px; font-weight: bold; color: #ffffff; margin-bottom: 30px; text-align: center; }
        .SolMenu a { display: block; color: #b5b3bc; text-decoration: none; padding: 12px; margin-bottom: 10px; border-radius: 5px; }
        .SolMenu a:hover { color: #ffffff; background-color: #231c44; border-left: 4px solid #8a2be2; }
        .SagIcerik { flex: 1; padding: 40px; overflow-y: auto; }
        .Geri { color: #bc13fe; text-decoration: none; font-size: 14px; }
        .Geri:hover { color: #d36bff; }
        .NotFormu { background-color: #16122c; border: 1px solid rgba(138, 43, 226, 0.2); border-radius: 12px; padding: 20px; margin-top: 20px; }
        .NotFormu label { display: block; font-size: 13px; color: #b5b3bc; margin-bottom: 6px; }
        .NotFormu input, .NotFormu textarea { width: 100%; background-color: #0d0b18; border: 1px solid rgba(138, 43, 226, 0.3); border-radius: 6px; color: #ffffff; padding: 10px 12px; margin-bottom: 14px; box-sizing: border-box; font-family: inherit; }
        .NotFormu input:focus, .NotFormu textarea:focus { outline: none; border-color: #8a2be2; }
        .NotFormu textarea { min-height: 260px; resize: vertical; }
        .Btn { background-color: #a40ae0; color: #ffffff; border: none; border-radius: 8px; padding: 10px 22px; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-block; font-size: 14px; }
        .Btn:hover { background-color: #8a2be2; color: #ffffff; }
        .BtnIptal { background: transparent; border: 1px solid rgba(255, 255, 255, 0.3); color: #b5b3bc; margin-left: 8px; }
        .BtnIptal:hover { background-color: #231c44; color: #ffffff; }
        .FormHata { background-color: rgba(255, 77, 109, 0.12); border: 1px solid #ff4d6d; color: #ff8fa3; border-radius: 6px; padding: 10px 14px; margin-top: 20px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="TumEkran">
        <div class="SolMenu">
            <div class="MenuBaslik">🧠 AI Study Assist</div>
            <a href="{{ url_for('dashboard') }}">🏠 Dashboard</a>
            <a href="{{ url_for('derslerim') }}" style="color: #ffffff; background-color: #231c44; border-left: 4px solid #8a2be2;">📚 Derslerim</a>
            <a href="{{ url_for('ai_sohbet') }}">🤖 AI Sohbet</a>
            <a href="#">⚙️ Ayarlar</a>
            <br><br>
            <a href="{{ url_for('logout') }}" style="color: #ff4d6d;">🚪 Çıkış Yap</a>
        </div>

        <div class="SagIcerik">
            <a class="Geri" href="{{ url_for('ders_detay', ders_id=ders.id) }}">← {{ ders.name }} dersine dön</a>
            <h2 class="mt-2">✏️ Notu Düzenle</h2>

            {% if hata %}
            <div class="FormHata">{{ hata }}</div>
            {% endif %}

            <form class="NotFormu" action="{{ url_for('not_duzenle', not_id=not_id) }}" method="POST">
                <label for="title">Not Başlığı *</label>
                <input type="text" id="title" name="title" maxlength="150" value="{{ baslik }}" required>
                <label for="content">Not İçeriği</label>
                <textarea id="content" name="content" maxlength="20000">{{ icerik }}</textarea>
                <button type="submit" class="Btn">💾 Kaydet</button>
                <a class="Btn BtnIptal" href="{{ url_for('ders_detay', ders_id=ders.id) }}">İptal</a>
            </form>
        </div>
    </div>
</body>
</html>
